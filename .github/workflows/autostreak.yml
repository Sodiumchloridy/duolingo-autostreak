name: Duolingo Autostreak

on:
  schedule:
    # Runs daily at 04:00 UTC (adjust to your preferred time)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Autostreak
        env:
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
          LESSONS: 1
          RANDOM_DELAY: 300 # Random delay up to 5 minutes (in seconds)
        run: node duolingo.js
